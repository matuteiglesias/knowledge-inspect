# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.inspect.runtime
repository:
  id: repo.knowledge-inspect
  github: matuteiglesias/knowledge-inspect
domain: knowledge
system: kb.inspect
role: inspection-producer
lifecycle: active
authority:
  status: bounded-consumer-proofs
  owns:
  - knowledge-store selection and inspection
  - semantic representation derivative state used by inspection
  - run manifests and evidence of selection
  - bounded analysis outputs
  - producer-specific deterministic projection of governed Knowledge Inspect summaries into generic JSONL evidence records
  - bounded lexical query/top_k semantics over explicitly approved governed chunk projections
  does_not_own:
  - source paper parsing
  - raw chat/day-file source interpretation
  - politics-wiki speech source, speech, capture, or chunk logical identity
  - universal source-ingestion authority
  - shared schema authority
  - evidence promotion authority
  - context routing
  - MCP transport policy
  - universal retrieval or reranking architecture
interfaces:
  consumes:
  - artifact:kb.paper-chunk-set@1
  - producer-local:matuteiglesias/politics-wiki/speech_chunk_set.s3.v1
  produces:
  - artifact:kb.run-manifest@1
  - artifact:kb.summary-bus@1
  - consumer-local:knowledge_inspect.speech_lexical_index.s3.v1
  - consumer-local:knowledge_inspect.speech_query_results.s3.v1
  - producer-local:knowledge-inspect.evidence-jsonl@1
upstream:
- repo.kb-contracts
- repo.paper-kb
- repo.politics-wiki
downstream:
- repo.context
- repo.gpt-digests
- repo.matias-context-mcp
canonical_commands:
- make health
- make smoke
- make verify-run-evidence-demo
- make verify-semantic-runtime
- make verify-speech-consumer
- make verify-evidence-export
generated_paths:
- runs/
- artifacts/
verification:
  status: bounded-adapter-consumer-proof
  last_verified: '2026-10-07'
  command: make verify-evidence-export
  proven:
  - producer-local:knowledge-inspect.evidence-jsonl@1 deterministically projects governed summary_bus/chunk_set_summary artifacts into generic JSONL
  - the adapter strips producer-local physical paths while preserving run identity and source/text checksums
  - KB Artifacts PR #13 pins Knowledge Inspect commit 7832ed5f33df03e87b2b146cd51f798121c79dc8 and consumes the adapter output only through its generic JSONL reader
  - the consumer proof preserves source_ref identity and adapter-output SHA-256 through selection while using logical corpus aliases
  - MCP M7 CI proves the resulting KB Artifacts manifest remains path-safe and readable through the existing manifest resource
  unknowns:
  - this proof covers summary_bus/chunk_set_summary only; other Knowledge Inspect artifact families require separate adapters or proofs
  - promotion/publication authority remains downstream and is not exercised by this adapter proof
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
