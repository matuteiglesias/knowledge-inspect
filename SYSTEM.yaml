  proven:
  - Paper KB producer-owned chunk_set artifacts validate through the real Knowledge Inspect consumer CLI in cross-repo CI
  - canonical smoke begins from a sanitized producer-owned governed chunk_set fixture rather than raw chat/day-file parsing
  - the retained kb_chat_ingest path is explicitly legacy compatibility and records non-authoritative source status in run evidence
  - embedding cache, processed-state, and Chroma derivative identity are representation-aware while logical chunk identity remains stable
  - a sanitized governed fixture can be indexed, directly queried, target-reset, rebuilt, and queried again with stable logical membership while unrelated Chroma state survives
  - governed chunk_set analysis records no false vector/retrieval/clustering use, while Chroma fallback records the resolved embedding representation and membership/result identity
  - the first real speech retrieval consumer proved deterministic lexical query/top_k over one exact politics-wiki speech projection while preserving producer speech/capture/chunk IDs and source URL evidence end-to-end
  - the five Speech Atlas acceptance concepts were served without embeddings, filters, reranking, political labels, or source-authority duplication
  unknowns:
  - query/top_k is proven only for the bounded speech lexical adapter and does not establish universal retrieval semantics
  - W3 found no direct current Knowledge Inspect -> KB Artifacts handoff
  - exact remaining downstream interface compatibility remains an independent proof task
maintenance:
