# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.inspect.runtime
repository:
  id: repo.knowledge-inspect
  github: matuteiglesias/knowledge-inspect
domain: knowledge
system: kb.inspect
role: inspection-producer
lifecycle: active
authority:
  status: proposed
  owns:
  - knowledge-store selection and inspection
  - run manifests and evidence of selection
  - bounded analysis outputs
  does_not_own:
  - source paper parsing
  - shared schema authority
  - evidence promotion authority
  - context routing
  - downstream JSONL evidence adaptation
  - MCP transport policy
interfaces:
  consumes:
  - contract:kb.chunk-set@1
  - artifact:kb.paper-chunk-set@1
  produces:
  - artifact:kb.run-manifest@1
  - artifact:kb.summary-bus@1
upstream:
- repo.kb-contracts
- repo.paper-kb
downstream:
- repo.context-routing
- repo.matias-context-mcp
canonical_commands:
- make health
- make smoke
- make verify-run-evidence-demo
generated_paths:
- runs/
- artifacts/
verification:
  status: metadata-only
  last_verified: '2026-08-28'
  command: make verify-run-evidence-demo
  unknowns:
  - canonical commands were reconciled against AGENTS.md and Makefile but not executed during W2
  - W3 proved paper-kb chunk_set input compatibility but found no direct current Knowledge Inspect -> KB Artifacts handoff
  - exact remaining downstream interface compatibility remains an interface-proof task for W3
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
