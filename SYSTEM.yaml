# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.inspect.runtime
repository:
  id: repo.knowledge-inspect
  github: matuteiglesias/knowledge-inspect
domain: knowledge
system: kb.inspect
role: inspection-producer
lifecycle: active
authority:
  status: bounded-consumer-proofs
  owns:
  - knowledge-store selection and inspection
  - semantic representation derivative state used by inspection
  - run manifests and evidence of selection
  - bounded analysis outputs
  - bounded lexical query/top_k semantics over explicitly approved governed chunk projections
  does_not_own:
  - source paper parsing
  - raw chat/day-file source interpretation
  - politics-wiki speech source, speech, capture, or chunk logical identity
  - universal source-ingestion authority
  - shared schema authority
  - evidence promotion authority
  - context routing
  - downstream JSONL evidence adaptation
  - MCP transport policy
  - universal retrieval or reranking architecture
interfaces:
  consumes:
  - artifact:kb.paper-chunk-set@1
  - producer-local:matuteiglesias/politics-wiki/speech_chunk_set.s3.v1
  produces:
  - artifact:kb.run-manifest@1
  - artifact:kb.summary-bus@1
  - consumer-local:knowledge_inspect.speech_lexical_index.s3.v1
  - consumer-local:knowledge_inspect.speech_query_results.s3.v1
upstream:
- repo.kb-contracts
- repo.paper-kb
- repo.politics-wiki
downstream:
- repo.context-routing
- repo.matias-context-mcp
canonical_commands:
- make health
- make smoke
- make verify-run-evidence-demo
- make verify-semantic-runtime
- make verify-speech-consumer
generated_paths:
- runs/
- artifacts/
verification:
  status: bounded-interface-proofs
  last_verified: '2026-08-30'
  command: make smoke; make verify-run-evidence-demo; make verify-semantic-runtime; make verify-speech-consumer
  speech_s3_proof:
    producer_workflow_run_id: '33340133664'
