    source_release_id: speech-release:ed23fb80b11f342fcc72b65f
    projection_id: speech-chunks:47e79e2e782cef5ed53ea4a4
    producer_chunk_count: 415
    producer_chunk_inventory_sha256: 0ccc3d797eb884667c4661d95de0711b51160aa9fe0292e37115931a2ed74f47
    consumer_head: 3c287e0de5f2634deab5e7fee4159af731414642
