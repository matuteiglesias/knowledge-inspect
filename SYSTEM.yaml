# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.inspect.runtime
repository:
  id: repo.knowledge-inspect
  github: matuteiglesias/knowledge-inspect
domain: knowledge
system: kb.inspect
role: inspection-producer
lifecycle: active
authority:
  status: proposed
  owns:
  - knowledge-store selection and inspection
  - run manifests and evidence of selection
  - bounded analysis outputs
  does_not_own:
  - source paper parsing
  - shared schema authority
  - evidence promotion authority
  - context routing
  - downstream JSONL evidence adaptation
  - MCP transport policy
interfaces:
  consumes:
  - artifact:kb.paper-chunk-set@1
  produces:
  - artifact:kb.run-manifest@1
  - artifact:kb.summary-bus@1
upstream:
- repo.kb-contracts
- repo.paper-kb
downstream:
- repo.context-routing
- repo.matias-context-mcp
canonical_commands:
- make health
- make smoke
- make verify-run-evidence-demo
generated_paths:
- runs/
- artifacts/
verification:
  status: bounded-interface-proofs
  last_verified: '2026-08-29'
  command: make verify-run-evidence-demo
  proven:
  - Paper KB producer-owned chunk_set artifacts validate through the real Knowledge Inspect consumer CLI in cross-repo CI
  unknowns:
  - W3 found no direct current Knowledge Inspect -> KB Artifacts handoff
  - exact remaining downstream interface compatibility remains an independent proof task
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
