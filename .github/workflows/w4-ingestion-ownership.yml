name: w4-ingestion-ownership

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile health
        run: make health
      - name: Governed artifact smoke
        run: make smoke
      - name: W4 ownership proofs
        run: python -m unittest -v tests.test_w4_governed_smoke tests.test_chat_ingest_smoke
